# Paper training recipe (Sensors 2022, §4.3). BraTS-2020, four modalities.
seed: 0
device: cuda
model: paper
skip: fullscale
attention: gate
bottleneck: conv
deep_supervision: false
dropout: 0.0
augment: false
in_channels: 4
out_channels: 1
width_mult: 1.0
fusion_channels: 64
epochs: 200
batch_size: 2
lr: 0.01
lr_factor: 0.2
lr_patience: 5
optimizer: adam
loss: bce
size: [128, 128, 128]
brats_root: data/brats2020
synthetic: false
num_workers: 4
out_dir: outputs/paper
pretrained: true
